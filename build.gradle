plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }

        filter {
            includeGroup "maven.modrinth"
        }
    }
}

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }

        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Bountiful 8.0.0-beta.2 - NeoForge 1.21.1
    implementation "maven.modrinth:BpwWFOVM:swTb6NU9"

    // Kambrik 8.0.0-beta.2 - dependencia usada por Bountiful
    implementation "maven.modrinth:zfbCkvdZ:rCSmCZpX"

    // Cobblemon 1.7.3 NeoForge - integración OPCIONAL.
    // compileOnly permite compilar la integración sin convertir Cobblemon
    // en dependencia obligatoria del JAR final.
    compileOnly "maven.modrinth:MdwFAVRL:S1TrAn8c"

    // Sólo para los runs de desarrollo (runClient/runServer).
    // Tampoco se empaqueta dentro de Bountiful Requests.
    runtimeOnly "maven.modrinth:MdwFAVRL:S1TrAn8c"
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            neo_version_range       : neo_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version
    ]

    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}