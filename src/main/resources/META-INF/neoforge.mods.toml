modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="CraftersCR"
description='''
Adds player-created requests, an in-game request editor,
physical escrow rewards, deliveries and managed rotations
to Bountiful.
'''

[[mixins]]
config="bountifulrequests.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="bountiful"
type="required"
versionRange="[8.0.0-beta.2,9.0.0)"
ordering="AFTER"
side="BOTH"